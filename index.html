<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>崔志宇给我好好回答</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg,#ffd9e8 0%,#ffc0d9 45%,#ffb3d1 100%);
    display:flex; align-items:center; justify-content:center;
    user-select:none; touch-action:manipulation;
  }
  .wrap {
    width:100%; max-width:480px; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    padding: 6vh 24px 8vh;
  }

  /* ---------- 顶部标题 ---------- */
  .title {
    font-size: clamp(20px, 6vw, 30px);
    font-weight: 800;
    color:#c2185b;
    text-align:center;
    letter-spacing:1px;
    text-shadow: 0 2px 6px rgba(255,255,255,.8);
    transition: all .35s ease;
    min-height: 1.3em;
  }
  .title.happy { color:#e91e63; }

  /* ---------- 图片区 ---------- */
  .stage {
    flex:1;
    width:100%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .stage img {
    max-width: 82%;
    max-height: 46vh;
    object-fit: contain;
    filter: drop-shadow(0 12px 24px rgba(194,24,91,.28));
    transition: transform .35s ease;
    animation: float 2.6s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  /* 生气抖动 */
  .stage.shake img { animation: shake .45s ease infinite; }
  @keyframes shake {
    0%,100% { transform: translate(-3px,0) rotate(-2deg); }
    25%     { transform: translate(3px,-4px) rotate(2deg); }
    50%     { transform: translate(-3px,-2px) rotate(-1.5deg); }
    75%     { transform: translate(3px,0) rotate(1.5deg); }
  }
  /* 开心跳跃 */
  .stage.jump img { animation: jump .6s ease infinite; }
  @keyframes jump {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-22px) scale(1.05); }
  }

  /* ---------- 按钮区 ---------- */
  .btns {
    width:100%;
    display:flex; gap:16px; justify-content:center;
    padding-bottom: 2vh;
  }
  button {
    flex:1;
    max-width:180px;
    padding: 16px 0;
    font-size: clamp(16px,5vw,20px);
    font-weight:700;
    border:none; border-radius:999px;
    color:#fff; cursor:pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.14), 0 8px 18px rgba(0,0,0,.14);
    transition: transform .12s ease, box-shadow .12s ease, opacity .3s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
  #no  { background: linear-gradient(145deg,#9e9e9e,#6d6d6d); }
  #yes { background: linear-gradient(145deg,#ff5f8d,#e91e63); }

  .btns.hide { opacity:0; pointer-events:none; transform: translateY(12px); }
  .btns { transition: opacity .3s ease, transform .3s ease; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title" id="title">崔志宇给我好好回答</div>

    <div class="stage" id="stage">
      <!-- ★ 待机图片：换成你自己的 p1 链接 -->
      <img id="pic" src="p1.png" alt="待机">
    </div>

    <div class="btns" id="btns">
      <button id="no">不喜欢</button>
      <button id="yes">喜欢</button>
    </div>
  </div>

<script>
  // ====== ★★★ 你只需要改这里：把图片换成本地文件名或图床链接 ★★★ ======
  const IMG_IDLE  = "p1.png";   // 待机
  const IMG_ANGRY = "p2.png";   // 生气
  const IMG_HAPPY = "p3.png";   // 开心
  // ====================================================================

  const title = document.getElementById('title');
  const stage = document.getElementById('stage');
  const pic   = document.getElementById('pic');
  const btns  = document.getElementById('btns');

  // 预加载，避免切换时卡白
  [IMG_ANGRY, IMG_HAPPY].forEach(s => { const i = new Image(); i.src = s; });

  document.getElementById('yes').addEventListener('click', () => {
    pic.src = IMG_HAPPY;
    stage.classList.remove('shake');
    stage.classList.add('jump');       // 开心跳跃
    title.textContent = '我也喜欢你 ❤️'; // 文字变化
    title.classList.add('happy');
    btns.classList.add('hide');         // 选完隐藏按钮
  });

  document.getElementById('no').addEventListener('click', () => {
    pic.src = IMG_ANGRY;
    stage.classList.remove('jump');
    stage.classList.add('shake');       // 生气抖动
    title.textContent = '你怎么敢不喜欢我 😡';
    btns.classList.remove('hide');
    // 4秒后回到待机，让他可以重选
    setTimeout(() => {
      pic.src = IMG_IDLE;
      stage.classList.remove('shake');
      title.textContent = '崔志宇给我好好回答';
    }, 4000);
  });
</script>
</body>
</html>
